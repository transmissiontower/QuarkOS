menuentry "Asm"{
    multiboot /boot/kernel
    module /boot/storage_server.qex "storage_server role=service priv=ata"
    module /boot/input_server.qex "input_server role=service priv=ps2"
    module /boot/time_server.qex "time_server role=service"
    module /boot/comp.qex "comp role=service"
    module /boot/font_atlas.bin "type=font"
    module /boot/icons.bin "type=icons"
    module /boot/wallpaper.bin "type=wallpaper"
    module /boot/logo.bmp "type=logo"
    
    boot
}